name: Build and Publish Edge Image

on:
  push:
    branches:
      - master

jobs:
  build-and-push-edge:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build commit
        id: vars
        run: echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push edge image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            PARKER_BUILD_COMMIT=${{ steps.vars.outputs.commit }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/parker:edge

<div class="bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl">

    <div class="flex items-center space-x-4 mb-6 border-b border-gray-700 pb-4">
        <span class="text-gray-400">Match</span>
        <select x-model="match" class="bg-gray-700 text-white rounded px-3 py-1 border border-gray-600 focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="all">All Rules (AND)</option>
            <option value="any">Any Rule (OR)</option>
        </select>
        <span class="text-gray-400">of the following:</span>
    </div>

    <div class="space-y-4">
        <template x-for="(rule, index) in rules" :key="rule.id">
            <div class="flex flex-col md:flex-row gap-3 items-start bg-gray-900/50 p-3 rounded-lg border border-gray-700/50">

                <select x-model="rule.field" x-on:change="resetRule(rule)" class="w-full md:w-48 bg-gray-700 text-white rounded px-3 py-2 border border-gray-600 outline-none">
                    <optgroup label="Metadata">
                        <option value="series">Series Name</option>
                        <option value="title">Issue Title</option>
                        <option value="publisher">Publisher</option>
                        <option value="year">Release Year</option>
                        <option value="format">Format</option>
                        <option value="imprint">Imprint</option>
                        <option value="summary">Summary</option>
                        <option value="web">Web/Wiki Link</option>
                        <option value="rating">Source Rating</option>
                        <option value="parker_rating">Parker Rating</option>
                        <option value="age_rating">Age Rating</option>
                        <option value="language">Language (ISO)</option>
                    </optgroup>
                    <optgroup label="Creators">
                        <option value="writer">Writer</option>
                        <option value="penciller">Penciller</option>
                        <option value="inker">Inker</option>
                        <option value="colorist">Colorist</option>
                        <option value="letterer">Letterer</option>
                        <option value="cover_artist">Cover Artist</option>
                        <option value="editor">Editor</option>
                    </optgroup>
                    <optgroup label="Tags">
                        <option value="character">Character</option>
                        <option value="team">Team</option>
                        <option value="location">Location</option>
                        <option value="genre">Genre</option>
                    </optgroup>
                    <optgroup label="Organization">
                        <option value="library">Library</option>
                        <option value="collection">Collection</option>
                        <option value="reading_list">Reading List</option>
                        <option value="pull_list">Stack</option>
                    </optgroup>
                </select>

                <select
                    x-model="rule.operator"
                    x-effect="$el.value = rule.operator"
                    class="w-full md:w-40 bg-gray-700 text-white rounded px-3 py-2 border border-gray-600 outline-none"
                >
                    <template x-for="option in operatorOptions(rule.field)" :key="`${rule.id}-${option.value}`">
                        <option :value="option.value" :selected="rule.operator === option.value" x-text="option.label"></option>
                    </template>
                </select>

                <div class="flex-1 w-full" x-show="!['is_empty', 'is_not_empty'].includes(rule.operator)">

                    <div x-show="usesSimpleInput(rule.field) && !usesNumericInput(rule.field)">
                        <input
                            type="text"
                            x-on:keydown.enter="performSearch()"
                            x-model="rule.value"
                            :class="ruleHasValidationError(rule) ? 'border-amber-500 focus:border-amber-400' : 'border-gray-600 focus:border-blue-500'"
                            class="w-full bg-gray-700 text-white rounded px-3 py-2 border outline-none"
                        >
                    </div>

                    <div x-show="usesNumericInput(rule.field)">
                        <input
                            type="number"
                            :step="numericInputStep(rule.field)"
                            :min="numericInputMin(rule.field)"
                            :max="numericInputMax(rule.field)"
                            x-on:keydown.enter="performSearch()"
                            x-model="rule.value"
                            :class="ruleHasValidationError(rule) ? 'border-amber-500 focus:border-amber-400' : 'border-gray-600 focus:border-blue-500'"
                            class="w-full bg-gray-700 text-white rounded px-3 py-2 border outline-none"
                        >
                    </div>

                    <div x-show="!usesSimpleInput(rule.field)">
                        <div
                            x-data="tagInput(rule)"
                            class="relative w-full"
                        >
                            <div
                                :class="ruleHasValidationError(rule) ? 'border-amber-500' : 'border-gray-600'"
                                class="bg-gray-700 border rounded p-1 flex flex-wrap gap-2 min-h-[42px]"
                            >
                                <template x-for="(tag, i) in tags" :key="i">
                                    <span class="bg-blue-600 text-white text-sm px-2 py-0.5 rounded flex items-center">
                                        <span x-text="tag"></span>
                                        <button x-on:click="removeTag(i)" class="ml-1 hover:text-red-300 font-bold">×</button>
                                    </span>
                                </template>

                                <input
                                    type="text"
                                    x-model="input"
                                    x-show="!(['equal', 'not_equal'].includes(rule.operator) && tags.length > 0)"
                                    @input.debounce.300ms="fetchSuggestions()"
                                    x-on:keydown.enter.prevent="addTag()"
                                    x-on:keydown.backspace="handleBackspace()"
                                    x-on:blur="addTag()"
                                    class="bg-transparent border-none focus:ring-0 text-white flex-1 min-w-[120px] outline-none h-8 px-1"
                                    placeholder="Type to find..."
                                >
                            </div>

                            <div x-show="suggestions.length > 0" x-on:click.away="suggestions = []" class="absolute z-10 w-full bg-gray-700 border border-gray-600 rounded mt-1 shadow-lg max-h-60 overflow-y-auto">
                                <template x-for="sugg in suggestions" :key="sugg">
                                    <div
                                        x-on:click="selectSuggestion(sugg)"
                                        x-on:mousedown.prevent
                                        class="px-3 py-2 hover:bg-blue-600 cursor-pointer text-white border-b border-gray-600 last:border-0"
                                        x-text="sugg"
                                    ></div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <p
                        x-show="ruleHasValidationError(rule)"
                        x-text="ruleValidationMessage(rule)"
                        class="mt-2 text-sm text-amber-400"
                    ></p>

                </div>

                <button x-on:click="removeRule(index)" class="text-red-400 hover:text-red-300 p-2 hover:bg-red-900/30 rounded" title="Remove Rule">
                    ✕
                </button>
            </div>
        </template>
    </div>

    <div class="mt-4">
        <button x-on:click="addRule()" class="text-blue-400 hover:text-blue-300 font-bold flex items-center px-3 py-2 hover:bg-gray-700 rounded transition-colors">
            <span class="text-xl mr-2">+</span> Add Rule
        </button>
    </div>

    <div class="border-t border-gray-700 my-6"></div>

    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex flex-wrap items-center gap-x-6 gap-y-3">
            {% if search_result_modes %}
            <div class="flex items-center space-x-2">
                <span class="text-gray-400 text-sm">Show</span>
                <div class="inline-flex rounded border border-gray-600 overflow-hidden text-sm" role="group" aria-label="Show results as">
                    <button type="button" x-on:click="setResultMode('issues')" :aria-pressed="(resultMode === 'issues').toString()"
                            :class="resultMode === 'issues' ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-300 hover:text-white'"
                            class="px-3 py-1 transition-colors" data-result-mode="issues">Issues</button>
                    <button type="button" x-on:click="setResultMode('series')" :aria-pressed="(resultMode === 'series').toString()"
                            :class="resultMode === 'series' ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-300 hover:text-white'"
                            class="px-3 py-1 border-l border-gray-600 transition-colors" data-result-mode="series">Series</button>
                </div>
            </div>
            {% endif %}
            <div class="flex items-center space-x-2">
                <span class="text-gray-400 text-sm">Sort By</span>
                <select x-model="sortBy" x-on:change="handleSortByChange()" class="bg-gray-700 text-white rounded px-2 py-1 text-sm border border-gray-600 outline-none">
                    <option value="created">Date Added</option>
                    <option value="updated">Date Updated</option>
                    <option value="year">Release Year</option>
                    <option value="series">Series Name</option>
                    <option value="title" x-show="sortOptionAvailable('title')" :disabled="!sortOptionAvailable('title')">Issue Title</option>
                    <option value="page_count" x-show="sortOptionAvailable('page_count')" :disabled="!sortOptionAvailable('page_count')">Page Count</option>
                    <option value="rating">Source Rating</option>
                    <option value="parker_rating">Parker Rating</option>
                </select>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-gray-400 text-sm">Order</span>
                <select x-model="sortOrder" class="bg-gray-700 text-white rounded px-2 py-1 text-sm border border-gray-600 outline-none">
                    <option value="asc" x-text="sortOrderLabel('asc')">Ascending</option>
                    <option value="desc" x-text="sortOrderLabel('desc')">Descending</option>
                </select>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-gray-400 text-sm">Limit</span>
                <input type="number" x-model="limit" class="w-20 bg-gray-700 text-white rounded px-2 py-1 text-sm border border-gray-600 outline-none text-center">
            </div>
        </div>

        <button
            x-on:click="performSearch()"
            :disabled="loading"
            :class="loading ? 'bg-gray-600 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500'"
            class="w-full md:w-auto text-white font-bold py-2 px-8 rounded-lg shadow-lg flex items-center justify-center gap-2 transition-colors"
        >
            <span x-show="loading" class="animate-spin">↻</span>
            <span>Search Comics</span>
        </button>
    </div>
</div>

<div class="mt-8" x-show="hasSearched" style="display: none;">
    <h2 class="text-xl font-bold mb-4 flex items-center text-white">
        Results
        <span class="ml-3 text-sm font-normal text-gray-300 bg-gray-800 px-3 py-1 rounded-full border border-gray-700" x-text="resultsCountLabel"></span>
    </h2>

    <template x-if="resultsMode === 'issues'">
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
             <template x-for="comic in results" :key="comic.id">
                {% include "partials/comic_card.html" %}
             </template>
        </div>
    </template>

    <template x-if="resultsMode === 'series'">
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4" data-series-results>
             <template x-for="series in results" :key="series.id">
                {% include "partials/series_card.html" %}
             </template>
        </div>
    </template>

    <div x-show="!loading && results.length === 0" class="text-center py-20 bg-gray-800/50 rounded-xl border border-dashed border-gray-700">
        <p class="text-gray-400 text-lg" x-text="resultsMode === 'series' ? 'No series found matching your criteria.' : 'No comics found matching your criteria.'">No comics found matching your criteria.</p>
        <button x-on:click="rules=[{id:1, field:'series', operator:'contains', value:[]}]" class="mt-4 text-blue-400 hover:underline">Reset Filters</button>
    </div>
</div>

<div x-data="editMetadataModal()"
     x-show="isOpen"
     style="display: none;"
     @open-edit-metadata.window="open($event.detail.id)"
     class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm"
     x-transition.opacity>

    <div class="bg-gray-800 border border-gray-700 rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col"
         x-on:click.away="close()">

        <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center bg-gray-900/50 rounded-t-xl">
            <div>
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <span>📝</span> Edit Metadata
                </h3>
                <p class="text-xs text-gray-400 mt-0.5">Updates ComicInfo.xml inside the file.</p>
            </div>
            <button x-on:click="close()" class="text-gray-400 hover:text-white transition-colors">✕</button>
        </div>

        <div class="p-6 overflow-y-auto custom-scrollbar flex-1">

            <div x-show="loading" class="py-20 text-center">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500 mx-auto mb-4"></div>
                <p class="text-gray-400">Reading ComicInfo.xml...</p>
            </div>

            <div x-show="!loading && error" class="bg-red-900/20 border border-red-800 text-red-300 p-4 rounded mb-4">
                <p class="font-bold">Error</p>
                <p x-text="error" class="text-sm"></p>
                <p x-show="isCbr" class="text-xs mt-2 text-red-200">
                    Note: Editing .cbr/.rar files requires the 'rar' tool installed on the server.
                </p>
            </div>

            <form x-show="!loading && !error" class="space-y-6" x-on:submit.prevent="save()">

                <div class="grid grid-cols-1 sm:grid-cols-12 gap-4">
                    <div class="sm:col-span-8">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Series Name</label>
                        <input type="text" x-model="form.Series" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Vol</label>
                        <input type="text" x-model="form.Volume" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">#</label>
                        <input type="text" x-model="form.Number" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-12 gap-4">
                    <div class="sm:col-span-10">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Issue Title</label>
                        <input type="text" x-model="form.Title" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Year</label>
                        <input type="number" x-model="form.Year" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-12 gap-4">
                    <div class="sm:col-span-4">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Format</label>
                        <select x-model="form.Format" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none">
                            <option value="">None</option>
                            <template x-for="option in formatOptions" :key="option">
                                <option :value="option" x-text="option"></option>
                            </template>
                            <template x-if="form.Format && !formatOptions.includes(form.Format)">
                                <option :value="form.Format" x-text="form.Format"></option>
                            </template>
                        </select>
                    </div>
                    <div class="sm:col-span-4">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Age Rating</label>
                        <select x-model="form.AgeRating" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none">
                            <option value="">None</option>
                            <template x-for="option in ageRatingOptions" :key="option">
                                <option :value="option" x-text="option"></option>
                            </template>
                            <template x-if="form.AgeRating && !ageRatingOptions.includes(form.AgeRating)">
                                <option :value="form.AgeRating" x-text="form.AgeRating"></option>
                            </template>
                        </select>
                    </div>
                    <div class="sm:col-span-4">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Total Issues</label>
                        <input type="number" min="0" x-model="form.Count" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none">
                    </div>
                </div>

                <div class="relative">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Genre</label>
                    <input
                        type="text"
                        x-model="form.Genre"
                        @input.debounce.250ms="fetchGenreSuggestions()"
                        @focus="fetchGenreSuggestions()"
                        @keydown.escape.prevent="genreSuggestions = []"
                        class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none"
                        placeholder="Comma separated"
                    >
                    <div
                        x-show="genreSuggestions.length > 0"
                        x-on:click.away="genreSuggestions = []"
                        class="absolute z-20 mt-1 max-h-48 w-full overflow-y-auto rounded border border-gray-600 bg-gray-700 shadow-lg"
                    >
                        <template x-for="suggestion in genreSuggestions" :key="suggestion">
                            <button
                                type="button"
                                x-on:mousedown.prevent
                                x-on:click="selectGenreSuggestion(suggestion)"
                                class="block w-full border-b border-gray-600 px-3 py-2 text-left text-sm text-white transition-colors hover:bg-blue-600 last:border-0"
                                x-text="suggestion"
                            ></button>
                        </template>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Alternate Series</label>
                        <input type="text" x-model="form.AlternateSeries" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Alternate Number</label>
                        <input type="text" x-model="form.AlternateNumber" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Writer</label>
                        <input type="text" x-model="form.Writer" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none" placeholder="Comma separated">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Penciller</label>
                        <input type="text" x-model="form.Penciller" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none" placeholder="Comma separated">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Publisher</label>
                        <input type="text" x-model="form.Publisher" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Imprint</label>
                        <input type="text" x-model="form.Imprint" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Summary</label>
                    <textarea x-model="form.Summary" rows="4" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none text-sm leading-relaxed"></textarea>
                </div>
            </form>
        </div>

        <div class="p-6 border-t border-gray-700 bg-gray-900/50 rounded-b-xl flex justify-between items-center">
            <span class="text-xs text-gray-500 italic">
                Changes will trigger a library scan.
            </span>
            <div class="flex gap-3">
                <button x-on:click="close()" class="px-4 py-2 text-gray-400 hover:text-white text-sm">Cancel</button>
                <button
                    x-on:click="save()"
                    :disabled="saving || error"
                    class="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-6 py-2 rounded-lg font-bold flex items-center gap-2 transition-all">
                    <span x-show="saving" class="animate-spin h-4 w-4 border-b-2 border-white rounded-full"></span>
                    <span x-text="saving ? 'Writing...' : 'Save to File'"></span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function editMetadataModal() {
    return {
        isOpen: false,
        loading: false,
        saving: false,
        error: null,
        comicId: null,
        isCbr: false,
        genreSuggestions: [],
        formatOptions: [
            'Annual', 'Graphic Novel', 'Hardcover', 'Limited Series', 'Magazine',
            'One Shot', 'Special', 'TPB', 'Web Comic'
        ],
        ageRatingOptions: [
            'Early Childhood', 'Everyone', 'G', 'Kids to Adults', 'Everyone 10+',
            'PG', 'Teen', 'Rating Pending', 'M', 'MA15+', 'Mature 17+',
            'Adults Only 18+', 'R18+', 'X18+'
        ],

        // This mirrors the ComicInfo XML tags
        form: {
            Series: '', Number: '', Volume: '', Title: '', Summary: '',
            Year: '', Writer: '', Penciller: '', Publisher: '', Imprint: '',
            Count: '', AlternateSeries: '', AlternateNumber: '', Genre: '',
            Format: '', AgeRating: ''
        },

        async open(id) {
            this.comicId = id;
            this.isOpen = true;
            this.error = null;
            this.genreSuggestions = [];
            this.loading = true;

            try {
                // 1. Fetch current file info (Check extension)
                const checkRes = await fetch(window.parker.url(`/api/comics/${id}`));
                const comicData = await checkRes.json();

                const filePath = (comicData.file_path || '').toLowerCase();
                if (filePath.endsWith('.cbr') || filePath.endsWith('.rar')) {
                    this.isCbr = true;
                }

                // 2. Fetch current XML data
                // We reuse the existing endpoint or creating a dedicated GET metadata endpoint
                // For now, let's assume we can fetch the parsed metadata
                const res = await fetch(window.parker.url(`/api/comics/${id}/metadata`));
                if (!res.ok) throw new Error("Could not read metadata");

                const data = await res.json();
                // Populate form
                this.form = {
                    Series: data.series || '',
                    Number: data.number || '',
                    Volume: data.volume || '',
                    Title: data.title || '',
                    Summary: data.summary || '',
                    Year: data.year || '',
                    Writer: data.writer || '',
                    Penciller: data.penciller || '',
                    Publisher: data.publisher || '',
                    Imprint: data.imprint || '',
                    Count: data.count || '',
                    AlternateSeries: data.alternate_series || '',
                    AlternateNumber: data.alternate_number || '',
                    Genre: data.genre || '',
                    Format: data.format || '',
                    AgeRating: data.age_rating || ''
                };

            } catch(e) {
                console.error(e);
                this.error = e.message || "Failed to load metadata. File might be locked or unsupported.";
            } finally {
                this.loading = false;
            }
        },

        close() {
            this.isOpen = false;
            this.genreSuggestions = [];
        },

        genreTokens() {
            return (this.form.Genre || '')
                .split(',')
                .map((value) => value.trim())
                .filter(Boolean);
        },

        currentGenreToken() {
            const parts = (this.form.Genre || '').split(',');
            return (parts[parts.length - 1] || '').trim();
        },

        async fetchGenreSuggestions() {
            const token = this.currentGenreToken();
            if (token.length < 2) {
                this.genreSuggestions = [];
                return;
            }

            try {
                const res = await fetch(window.parker.route(
                    'search.suggestions',
                    {},
                    `field=genre&query=${encodeURIComponent(token)}`
                ));
                if (!res.ok) {
                    this.genreSuggestions = [];
                    return;
                }

                const existing = this.genreTokens().map((value) => value.toLowerCase());
                const suggestions = await res.json();
                this.genreSuggestions = suggestions
                    .filter((suggestion) => suggestion && !existing.includes(suggestion.toLowerCase()))
                    .slice(0, 10);
            } catch(e) {
                console.error(e);
                this.genreSuggestions = [];
            }
        },

        selectGenreSuggestion(value) {
            const existing = this.genreTokens().slice(0, -1);
            existing.push(value);
            this.form.Genre = existing.join(', ');
            this.genreSuggestions = [];
        },

        async save() {
            this.saving = true;
            try {
                const res = await fetch(window.parker.url(`/api/comics/${this.comicId}/metadata`), {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(this.form)
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.detail || "Save failed");
                }

                window.parker.showToast("File updated. Scan queued.", "success");
                this.close();

                // Optional: Reload the page to show new data
                //setTimeout(() => window.location.reload(), 1000);

            } catch(e) {
                console.error(e);
                this.error = e.message;
            } finally {
                this.saving = false;
            }
        }
    }
}
</script>

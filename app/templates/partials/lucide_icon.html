{% macro lucide_icon(name, classes="h-5 w-5") -%}

    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="{{ classes }}"
    aria-hidden="true"
    focusable="false"

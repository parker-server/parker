<template x-if="readingMode === 'paged'">
    <div class="reader-content"
         :class="{
            'magnifier-active': magnifierEnabled,
            'reader-content-fit-width': fitMode === 'width',
            'cursor-pointer': fitWidthPointerZone === 'edge'
         }"
         x-on:click="handleFitWidthContentClick($event)"
         x-on:mousemove="handleFitWidthPointerMove($event)"
         x-on:mouseleave="clearFitWidthPointerZone()">

        <div class="nav-zone left" :style="fitMode === 'width' ? 'pointer-events: none;' : ''" x-on:click="handleZoneClick('left')"></div>
        <div class="nav-zone center" :style="fitMode === 'width' ? 'pointer-events: none;' : ''" x-on:click="handleZoneClick('center')"></div>
        <div class="nav-zone right" :style="fitMode === 'width' ? 'pointer-events: none;' : ''" x-on:click="handleZoneClick('right')"></div>

        <div class="reader-page-stage flex items-center justify-center h-full w-full"
             :class="{
                'reader-page-stage-fit-width': fitMode === 'width',
                'flex-row': readDirection === 'ltr',
                'flex-row-reverse': readDirection === 'rtl',
                'gap-0': true
             }">

            <template x-for="(page, idx) in pagesToDisplay" :key="page.index">
                <img
                    :src="getPageUrl(page.index)"
                    class="reader-page"
                    :class="[imageClasses, {
                        'object-right': isDoublePageActive && pagesToDisplay.length > 1 && (
                            (readDirection === 'ltr' && idx === 0) ||
                            (readDirection === 'rtl' && idx === 1)
                        ),
                        'object-left': isDoublePageActive && pagesToDisplay.length > 1 && (
                            (readDirection === 'ltr' && idx === 1) ||
                            (readDirection === 'rtl' && idx === 0)
                        )
                    }]"
                    :style="imageStyles"
                    x-on:pointerenter="updateMagnifier($event, page.index)"
                    x-on:pointermove="updateMagnifier($event, page.index)"
                    x-on:pointerleave="hideMagnifier()"
                    alt="Page"
                >
            </template>

            <div class="absolute inset-y-0 left-1/2 w-24 -translate-x-1/2 pointer-events-none z-20"
                 x-show="isDoublePageActive && pagesToDisplay.length === 2 && showSpineShadow"
                 x-transition:enter="transition-opacity duration-200"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100"
                 style="background: linear-gradient(90deg,
                        transparent 0%,
                        rgba(0,0,0,0.05) 30%,
                        rgba(0,0,0,0.4) 50%,
                        rgba(0,0,0,0.05) 70%,
                        transparent 100%);">
            </div>
        </div>

        {% include "reader/partials/_reader_controls.html" %}
    </div>
</template>

<div class="reader-toolbar" :class="{'hidden': !shouldShowUI}">

    <div class="reader-toolbar-title-group flex items-center space-x-4 max-w-[50%]">
        <button x-on:click="exitReader()" class="text-gray-400 hover:text-white px-2 py-1 rounded hover:bg-white/10 transition-colors">
            <span class="mr-1">&times;</span> Close
        </button>

        <span
            x-show="isIncognito"
            x-cloak
            data-incognito-indicator
            class="inline-flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-full border border-amber-400/60 bg-amber-500/15 text-amber-200 shadow-[0_0_16px_rgba(251,191,36,0.2)]"
            title="Incognito Mode: progress and bookmark changes will not be saved."
            aria-label="Incognito Mode: progress and bookmark changes will not be saved.">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 11h16M7 11l1.5-5h7L17 11" />
                <circle cx="9" cy="15.5" r="2.5" stroke-width="2" />
                <circle cx="15" cy="15.5" r="2.5" stroke-width="2" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.5 15.5h1" />
            </svg>
        </span>

        <div class="flex flex-col overflow-hidden">
            <span class="font-bold text-white truncate" x-text="`${meta.series_name} #${meta.number}`"></span>

            <div class="flex items-center gap-2 text-xs truncate">
                <span class="text-xs text-gray-400 truncate" x-text="meta.title" x-bind:title="meta.title"></span>
                <template x-if="meta.context_total > 1">
                    <span class="text-blue-400 font-medium bg-blue-900/30 px-1.5 rounded border border-blue-500/30"
                          x-text="`${getContextLabel(meta.context_type)} / ${meta.context_label}: ${meta.context_position}/${meta.context_total}`">
                    </span>
                </template>
            </div>
        </div>
    </div>

    <div class="flex items-center space-x-2">
        <span class="text-gray-400 text-xs font-mono font-bold mr-3 hidden md:block" x-text="currentTime"></span>

        <div class="reader-toolbar-direct-actions">
            <button x-show="readingMode === 'paged'" x-on:click="toggleUiLock()" class="p-2 rounded hover:bg-white/10 transition-colors"
                    data-ui-lock-toggle
                    :class="uiLocked ? 'text-blue-400' : 'text-gray-300'"
                    title="Toggle UI Lock (h)">
                <svg x-show="uiLocked" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg x-show="!uiLocked" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                </svg>
            </button>

            <button x-on:click.stop="toggleMagnifier()"
                    data-magnifier-toggle
                    class="reader-pointer-action p-2 text-gray-300 hover:text-white rounded hover:bg-white/10"
                    :class="{'text-blue-400': magnifierEnabled}"
                    :aria-pressed="magnifierEnabled.toString()"
                    aria-label="Toggle magnifier"
                    title="Magnifier (z)">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <circle cx="10.5" cy="10.5" r="5.5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l5 5" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10.5h5" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.5 8v5" />
                </svg>
            </button>

            <button x-on:click.stop="toggleShortcuts()"
                    data-keyboard-shortcuts-toggle
                    class="reader-keyboard-shortcuts-toggle p-2 text-gray-300 hover:text-white rounded hover:bg-white/10"
                    :class="{'text-blue-400': showShortcuts}"
                    :aria-pressed="showShortcuts.toString()"
                    aria-label="Keyboard shortcuts"
                    title="Keyboard Shortcuts (?)">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <rect x="3" y="5" width="18" height="14" rx="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 9h.01M11 9h.01M15 9h.01M19 9h.01M7 13h.01M11 13h.01M15 13h.01M17 17H7" />
                </svg>
            </button>

            <button x-on:click.stop="toggleSettings()" class="p-2 text-gray-300 hover:text-white rounded hover:bg-white/10"
                    data-settings-toggle
                    :class="{'text-blue-400': showSettings}" title="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                </svg>
            </button>

            <button x-on:click="openBookmarks()" data-bookmarks-toggle class="p-2 text-gray-300 hover:text-white rounded hover:bg-white/10"
                    :class="{'text-blue-400': showBookmarks || currentBookmark}" title="Bookmarks (b)">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-4-7 4V5z" />
                </svg>
            </button>

            <button x-on:click="toggleFullscreen()"
                    data-fullscreen-toggle
                    class="reader-fullscreen-toggle p-2 text-gray-300 hover:text-white rounded hover:bg-white/10"
                    title="Toggle Fullscreen (f)">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                </svg>
            </button>
        </div>

        <div class="reader-toolbar-overflow relative">
            <button x-on:click.stop="toggleToolbarMenu()"
                    data-reader-toolbar-menu-toggle
                    class="p-2 text-gray-300 hover:text-white rounded hover:bg-white/10"
                    :class="{'text-blue-400': showToolbarMenu}"
                    :aria-expanded="showToolbarMenu.toString()"
                    aria-label="Reader actions">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h.01M12 12h.01M19 12h.01" />
                </svg>
            </button>

            <div x-show="showToolbarMenu"
                 x-cloak
                 data-reader-toolbar-menu
                 class="reader-toolbar-menu"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 -translate-y-1"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100 translate-y-0"
                 x-transition:leave-end="opacity-0 -translate-y-1"
                 x-on:click.away="showToolbarMenu = false">
                <button x-show="readingMode === 'paged'"
                        x-on:click="toggleUiLock(); showToolbarMenu = false"
                        data-reader-toolbar-lock
                        class="reader-toolbar-menu-item"
                        :class="uiLocked ? 'text-blue-300' : 'text-gray-200'">
                    <svg x-show="uiLocked" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    <svg x-show="!uiLocked" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                    </svg>
                    <span x-text="uiLocked ? 'Auto-Hide UI' : 'Pin UI'"></span>
                </button>

                <button x-on:click.stop="toggleMagnifier(); showToolbarMenu = false"
                        data-reader-toolbar-magnifier
                        class="reader-toolbar-menu-item reader-pointer-action"
                        :class="magnifierEnabled ? 'text-blue-300' : 'text-gray-200'">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <circle cx="10.5" cy="10.5" r="5.5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l5 5" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10.5h5" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.5 8v5" />
                    </svg>
                    <span>Magnifier</span>
                </button>

                <button x-on:click.stop="toggleSettings()"
                        data-reader-toolbar-settings
                        class="reader-toolbar-menu-item"
                        :class="showSettings ? 'text-blue-300' : 'text-gray-200'">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                    <span>Settings</span>
                </button>

                <button x-on:click="openBookmarks()"
                        data-reader-toolbar-bookmarks
                        class="reader-toolbar-menu-item"
                        :class="showBookmarks || currentBookmark ? 'text-blue-300' : 'text-gray-200'">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-4-7 4V5z" />
                    </svg>
                    <span>Bookmarks</span>
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    body { overflow: hidden; background: #000; }

    [x-cloak] { display: none !important; }

    .reader-container {
        position: fixed; inset: 0;
        background: #000;
        display: flex; flex-direction: column;
        z-index: 100;
        touch-action: pan-y;
        overflow: hidden;
    }

    .reader-container.scroll-mode {
        overflow-y: auto;
        overscroll-behavior-y: contain;
    }

    .reader-toolbar {
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(10px);
        padding: 0.75rem 1rem;
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        z-index: 50;
        transition: transform 0.3s;
        position: sticky;
        top: 0;
    }

    .reader-toolbar.hidden { transform: translateY(-100%); }

    .bookmark-detour-banner {
        position: sticky;
        top: 4.25rem;
        z-index: 45;
        backdrop-filter: blur(14px);
        background: linear-gradient(180deg, rgba(8, 12, 20, 0.96), rgba(11, 17, 28, 0.92));
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    .reader-content {
        flex: 1; display: flex; align-items: center; justify-content: center;
        overflow: hidden; position: relative;
    }

    .reader-content-fit-width {
        align-items: flex-start;
        justify-content: flex-start;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: contain;
    }

    .reader-page-stage-fit-width {
        align-items: flex-start !important;
        height: auto !important;
        min-height: 100%;
        padding-bottom: 9rem;
    }

    .reader-content-fit-width .reader-page,
    .reader-content-fit-width .reader-page-shell,
    .reader-content-fit-width .reader-page-shell-image {
        max-height: none;
    }

    .reader-page {
        max-width: 100%; max-height: 100%;
        object-fit: contain;
        user-select: none;
    }

    .reader-page-shell,
    .reader-scroll-page-shell {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        overflow: hidden;
    }

    .reader-page-shell-image {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        user-select: none;
    }

    .reader-scroll-page-shell {
        width: 100%;
        max-width: 100%;
    }

    .reader-overlay-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        overflow: visible;
    }

    .reader-overlay-layer.is-interactive,
    .reader-overlay-layer[data-overlay-interactive="true"] {
        pointer-events: all;
        touch-action: none;
    }

    .reader-overlay-interaction-capture {
        pointer-events: none;
    }

    .reader-overlay-layer.is-interactive .reader-overlay-interaction-capture,
    .reader-overlay-layer[data-overlay-interactive="true"] .reader-overlay-interaction-capture {
        pointer-events: all;
    }

    .reader-overlay-debug-border {
        stroke: rgba(251, 191, 36, 0.95);
        stroke-width: 2;
        stroke-dasharray: 8 5;
    }

    .reader-overlay-debug-crosshair {
        stroke: rgba(96, 165, 250, 0.85);
        stroke-width: 1.5;
        stroke-dasharray: 5 5;
    }

    .reader-overlay-debug-label {
        fill: rgba(254, 243, 199, 0.95);
        font-size: 0.035px;
        font-weight: 700;
        paint-order: stroke;
        stroke: rgba(0, 0, 0, 0.8);
        stroke-width: 0.008px;
    }

    .reader-overlay-debug-hud {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        z-index: 70;
        border: 1px solid rgba(251, 191, 36, 0.45);
        border-radius: 0.5rem;
        background: rgba(0, 0, 0, 0.78);
        color: rgba(254, 243, 199, 0.96);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.5rem 0.75rem;
        pointer-events: none;
    }

    .reader-annotation-panel {
        position: fixed;
        top: 4rem;
        right: 1rem;
        z-index: 65;
        width: min(22rem, calc(100vw - 2rem));
        max-height: calc(100vh - 5rem);
        overflow-y: auto;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 0.5rem;
        background: rgba(12, 16, 24, 0.96);
        color: white;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(14px);
    }

    .reader-annotation-reposition-toolbar {
        position: fixed;
        right: 1rem;
        bottom: calc(1rem + env(safe-area-inset-bottom));
        z-index: 65;
        display: flex;
        width: min(22rem, calc(100vw - 2rem));
        min-height: 3.75rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 0.5rem;
        background: rgba(12, 16, 24, 0.96);
        color: white;
        padding: 0.65rem 0.75rem;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.48);
        backdrop-filter: blur(14px);
    }

    .reader-annotation-peek {
        position: fixed;
        z-index: 64;
        width: min(18rem, calc(100vw - 1.5rem));
        min-height: 3rem;
        border: 1px solid rgba(148, 163, 184, 0.26);
        border-radius: 0.5rem;
        background: rgba(12, 16, 24, 0.96);
        color: white;
        padding: 0.65rem 0.75rem;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.48);
        backdrop-filter: blur(14px);
        pointer-events: auto;
    }

    .reader-annotation-peek.is-touch {
        left: 1rem;
        right: 1rem;
        bottom: calc(5.75rem + env(safe-area-inset-bottom));
        display: flex;
        width: auto;
        max-width: none;
        min-height: 4rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
    }

    .reader-annotation-peek-body {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
    }

    .reader-annotation-tool-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        min-height: 2.5rem;
        border: 1px solid rgba(75, 85, 99, 0.95);
        border-radius: 0.375rem;
        background: rgba(17, 24, 39, 0.92);
        color: rgb(209, 213, 219);
        font-size: 0.875rem;
        font-weight: 700;
        transition: background-color 0.18s, border-color 0.18s, color 0.18s;
    }

    .reader-annotation-tool-button:hover,
    .reader-annotation-tool-button.is-active {
        border-color: rgba(96, 165, 250, 0.85);
        background: rgba(37, 99, 235, 0.22);
        color: white;
    }

    .reader-annotation-color-button {
        width: 1.35rem;
        height: 1.35rem;
        border: 2px solid rgba(255, 255, 255, 0.22);
        border-radius: 9999px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.65);
        transition: transform 0.18s, border-color 0.18s;
    }

    .reader-annotation-color-button:hover,
    .reader-annotation-color-button.is-active {
        border-color: white;
        transform: scale(1.08);
    }

    .reader-annotation-list-item {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        border: 1px solid rgba(55, 65, 81, 0.9);
        border-radius: 0.5rem;
        background: rgba(17, 24, 39, 0.74);
        padding: 0.65rem 0.75rem;
        transition: background-color 0.18s, border-color 0.18s;
    }

    .reader-annotation-list-item:hover,
    .reader-annotation-list-item.is-selected {
        border-color: rgba(96, 165, 250, 0.74);
        background: rgba(30, 64, 175, 0.34);
    }

    .reader-annotation-overlay-item {
        cursor: pointer;
        pointer-events: auto;
    }

    .reader-overlay-layer.is-interactive .reader-annotation-overlay-item,
    .reader-overlay-layer[data-overlay-interactive="true"] .reader-annotation-overlay-item {
        cursor: grab;
    }

    .reader-annotation-overlay-item.is-dragging {
        cursor: grabbing;
    }

    .reader-annotation-hit-target {
        pointer-events: visiblePainted;
    }

    .reader-annotation-pin-marker {
        stroke-linejoin: round;
        stroke-width: 2;
        filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.55));
    }

    .reader-annotation-rect-fill {
        fill-opacity: 0.16;
    }

    .reader-annotation-rect-stroke {
        stroke-width: 2.5;
        stroke-linejoin: round;
        filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.45));
    }

    .reader-annotation-overlay-item.is-selected .reader-annotation-pin-marker,
    .reader-annotation-overlay-item.is-selected .reader-annotation-rect-stroke {
        stroke: white;
        stroke-width: 4;
    }

    .reader-annotation-overlay-item.is-draft {
        opacity: 0.78;
        pointer-events: none;
    }

    .reader-annotation-overlay-item.is-draft .reader-annotation-rect-stroke {
        stroke-dasharray: 8 5;
    }

    .reader-scroll-content {
        display: block;
        overflow: visible;
        padding: 1rem 0 9rem;
    }

    .reader-scroll-stack {
        width: min(100%, 1100px);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 0 1rem;
    }

    .reader-scroll-page {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        scroll-margin-top: 4.5rem;
    }

    .reader-scroll-image {
        width: 100%;
        height: auto;
        max-width: 100%;
        object-fit: contain;
        border-radius: 0.25rem;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        background: rgba(255, 255, 255, 0.02);
    }

    .nav-zone {
        position: absolute; top: 0; bottom: 0; width: 20%; z-index: 20;
        cursor: pointer;
    }

    .reader-nav-zone-paused {
        pointer-events: none;
    }

    .nav-zone.left { left: 0; }
    .nav-zone.right { right: 0; }
    .nav-zone:hover { background: linear-gradient(to right, rgba(255,255,255,0.05), transparent); }
    .nav-zone.right:hover { background: linear-gradient(to left, rgba(255,255,255,0.05), transparent); }

    .nav-zone.center {
        left: 20%;
        width: 60%;
        cursor: default;
    }

    .reader-controls {
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(10px);
        padding: 0.75rem 1.5rem; border-radius: 9999px;
        display: flex; align-items: center; gap: 1rem;
        opacity: 0; transition: opacity 0.3s, transform 0.3s;
        border: 1px solid rgba(255,255,255,0.1);
    }

    .reader-controls, .scrubber-wrapper {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s, transform 0.3s;
    }

    .controls-visible {
        opacity: 1 !important;
        pointer-events: auto !important;
    }

    .settings-panel {
        position: fixed; top: 4rem; right: 1rem;
        background: rgba(20, 20, 20, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 0.5rem;
        padding: 1rem;
        width: 250px;
        z-index: 60;
        color: white;
    }

    .range-slider {
        width: 100%; height: 4px; background: #4b5563;
        border-radius: 2px; outline: none; -webkit-appearance: none;
    }

    .range-slider::-webkit-slider-thumb {
        -webkit-appearance: none; width: 16px; height: 16px;
        background: #3b82f6; border-radius: 50%; cursor: pointer;
    }

    .scrubber-wrapper {
        width: 90%;
        max-width: 600px;
        height: 20px;
        display: flex; align-items: center;
        z-index: 55;
        opacity: 0; transition: opacity 0.3s;
        pointer-events: auto;
    }

    input[type=range].scrubber {
        -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer;
    }

    input[type=range].scrubber:focus { outline: none; }

    input[type=range].scrubber::-webkit-slider-runnable-track {
        width: 100%; height: 4px; cursor: pointer;
        background: rgba(255,255,255,0.3); border-radius: 2px;
        transition: height 0.2s, background 0.2s;
    }

    .scrubber-wrapper:hover input[type=range].scrubber::-webkit-slider-runnable-track {
        height: 6px; background: rgba(255,255,255,0.5);
    }

    input[type=range].scrubber::-webkit-slider-thumb {
        height: 12px; width: 12px; border-radius: 50%;
        background: #3b82f6; cursor: pointer;
        -webkit-appearance: none;
        margin-top: -4px;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
        transition: transform 0.2s;
    }

    .scrubber-wrapper:hover input[type=range].scrubber::-webkit-slider-thumb {
        transform: scale(1.5);
    }

    .scrubber-tooltip {
        position: absolute;
        bottom: 100%;
        margin-bottom: 10px;
        background: #3b82f6;
        color: white;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: bold;
        pointer-events: none;
        transform: translateX(-50%);
        white-space: nowrap;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
</style>
